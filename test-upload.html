<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>admin-upload 接口测试工具</title>
  <script type="module">
    import cloudbase from 'https://esm.sh/@cloudbase/js-sdk@2.28.5'
    window.cloudbase = cloudbase
    window.dispatchEvent(new Event('cloudbase-ready'))
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .test-section {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      border-left: 4px solid #667eea;
    }
    h2 {
      color: #667eea;
      font-size: 20px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 600;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .result-box {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 16px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.6;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      margin-top: 16px;
    }
    .success { color: #4ade80; }
    .error { color: #f87171; }
    .info { color: #60a5fa; }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      margin-left: 8px;
    }
    .status-success { background: #dcfce7; color: #166534; }
    .status-error { background: #fef2f2; color: #991b1b; }
    .status-pending { background: #e0e7ff; color: #3730a3; }
    input[type="file"] {
      display: none;
    }
    .upload-area {
      border: 3px dashed #cbd5e1;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: #f8fafc;
    }
    .upload-area:hover {
      border-color: #667eea;
      background: #f0f4ff;
    }
    .upload-area.has-file {
      border-color: #4ade80;
      background: #f0fdf4;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 admin-upload 接口测试工具</h1>
    
    <!-- 测试1：连通性 -->
    <div class="test-section">
      <h2>
        📡 测试1：接口连通性
        <span id="status1" class="status-badge status-pending">待测试</span>
      </h2>
      <p style="color: #666; margin-bottom: 16px;">
        测试HTTP接口是否可以正常访问和响应
      </p>
      <button class="btn btn-primary" onclick="testConnection()" id="btn1">
        开始测试连接
      </button>
      <div id="result1" class="result-box" style="display:none;"></div>
    </div>

    <!-- 测试2：图片上传 -->
    <div class="test-section">
      <h2>
        🖼️ 测试2：图片上传功能
        <span id="status2" class="status-badge status-pending">待测试</span>
      </h2>
      <p style="color: #666; margin-bottom: 16px;">
        选择一张图片测试上传到云存储的功能
      </p>
      
      <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
      
      <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
        <div style="font-size: 48px; margin-bottom: 12px;">📁</div>
        <div style="font-size: 18px; color: #333;">点击选择图片文件</div>
        <div style="font-size: 14px; color: #999; margin-top: 8px;">
          支持 JPG、PNG、GIF、WebP 格式，最大 5MB
        </div>
      </div>

      <div id="fileInfo" style="margin-top: 16px; display: none; padding: 12px; background: #e0f2fe; border-radius: 8px;">
        ✅ 已选择：<strong id="fileName"></strong> (<span id="fileSize"></span>)
      </div>

      <button 
        class="btn btn-primary" 
        onclick="testUpload()" 
        id="btn2"
        style="margin-top: 16px; display: none;"
      >
        ⬆️ 上传图片并测试
      </button>
      
      <div id="result2" class="result-box" style="display:none;"></div>
    </div>

    <!-- 配置信息 -->
    <div class="test-section" style="border-left-color: #f59e0b;">
      <h2>⚙️ 接口配置信息</h2>
      <div style="background: #fffbeb; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 14px;">
        <strong>调用方式:</strong> Cloudbase.callFunction (SDK直连，无请求体大小限制)<br><br>
        <strong>云函数:</strong> admin-upload<br><br>
        <strong>环境ID:</strong> cloud1-0gnyce4y6d0e6caa<br><br>
        <strong>目标目录:</strong> banner/
      </div>
    </div>
  </div>

  <script>
    const ENV_ID = 'cloud1-0gnyce4y6d0e6caa'
    let tcbApp = null
    let selectedFile = null

    async function initCloudbase() {
      if (tcbApp) return tcbApp
      if (!window.cloudbase) {
        await new Promise(resolve => window.addEventListener('cloudbase-ready', resolve, { once: true }))
      }
      tcbApp = window.cloudbase.init({ env: ENV_ID, persistence: 'local' })
      const auth = tcbApp.auth()
      await auth.signInAnonymously()
      console.log('[Cloudbase] ✓ 匿名登录成功')
      return tcbApp
    }

    // ========== 测试1：连通性 ==========
    async function testConnection() {
      const btn = document.getElementById('btn1')
      const status = document.getElementById('status1')
      const result = document.getElementById('result1')
      
      btn.disabled = true
      btn.textContent = '测试中...'
      status.className = 'status-badge status-pending'
      status.textContent = '测试中...'
      result.style.display = 'block'
      result.innerHTML = '<span class="info">正在初始化 Cloudbase...</span>\n'

      try {
        const app = await initCloudbase()
        result.innerHTML += '<span class="info">✅ Cloudbase 初始化完成</span>\n'
        result.innerHTML += '<span class="info">正在调用 admin-upload (action: test)...</span>\n'

        const res = await app.callFunction({
          name: 'admin-upload',
          data: { action: 'test', data: {} }
        })

        const data = res.result
        
        result.innerHTML += `<span class="info">[响应] ${JSON.stringify(data, null, 2)}</span>\n`

        if (data.code === 200) {
          status.className = 'status-badge status-success'
          status.textContent = '✅ 连通成功'
          result.innerHTML += `\n<span class="success">🎉 接口连通性正常！使用 Cloudbase.callFunction 方式调用，无请求体大小限制。</span>`
        } else {
          status.className = 'status-badge status-error'
          status.textContent = '❌ 连接异常'
          result.innerHTML += `\n<span class="error">⚠️ 接口返回异常状态码，请检查云函数部署和权限配置。</span>`
        }

      } catch (error) {
        status.className = 'status-badge status-error'
        status.textContent = '❌ 连接失败'
        result.innerHTML += `<span class="error">\n❌ 请求失败: ${error.message}\n\n可能的原因:\n1. 网络连接问题\n2. 云函数未部署\n3. 环境ID错误\n4. 匿名登录未开启\n\n请检查以上项目后重试。</span>`
      }

      btn.disabled = false
      btn.textContent = '重新测试'
    }

    // ========== 图片压缩 ==========
    function compressImage(file, maxWidth = 800, quality = 0.7) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader()
        reader.onload = (e) => {
          const img = new Image()
          img.onload = () => {
            const canvas = document.createElement('canvas')
            let width = img.width
            let height = img.height

            if (width > maxWidth) {
              height = (height * maxWidth) / width
              width = maxWidth
            }

            canvas.width = width
            canvas.height = height

            const ctx = canvas.getContext('2d')
            ctx.drawImage(img, 0, 0, width, height)

            const dataURL = canvas.toDataURL('image/jpeg', quality)
            resolve(dataURL)
          }
          img.onerror = () => reject(new Error('图片加载失败'))
          img.src = e.target.result
        }
        reader.onerror = () => reject(new Error('文件读取失败'))
        reader.readAsDataURL(file)
      })
    }

    // ========== 文件选择 ==========
    function handleFileSelect(event) {
      const file = event.target.files[0]
      if (!file) return

      selectedFile = file
      
      document.getElementById('fileName').textContent = file.name
      document.getElementById('fileSize').textContent = (file.size / 1024).toFixed(2) + ' KB'
      document.getElementById('fileInfo').style.display = 'block'
      document.getElementById('btn2').style.display = 'inline-block'
      document.getElementById('uploadArea').classList.add('has-file')
      document.getElementById('uploadArea').innerHTML = `
        <div style="font-size: 48px; margin-bottom: 12px;">✅</div>
        <div style="font-size: 18px; color: #166534;">已选择文件</div>
        <div style="font-size: 14px; color: #15803d; margin-top: 8px;">点击可重新选择</div>
      `
    }

    // ========== 测试2：上传 ==========
    async function testUpload() {
      if (!selectedFile) {
        alert('请先选择图片文件')
        return
      }

      const btn = document.getElementById('btn2')
      const status = document.getElementById('status2')
      const result = document.getElementById('result2')
      
      btn.disabled = true
      btn.textContent = '上传中...'
      status.className = 'status-badge status-pending'
      status.textContent = '上传中...'
      result.style.display = 'block'
      result.innerHTML = '<span class="info">正在读取文件...</span>\n'

      try {
        const app = await initCloudbase()

        const reader = new FileReader()
        const base64Data = await new Promise((resolve, reject) => {
          reader.onload = () => resolve(reader.result)
          reader.onerror = () => reject(new Error('文件读取失败'))
          reader.readAsDataURL(selectedFile)
        })

        result.innerHTML += `<span class="info">✅ 文件读取成功</span>\n`
        result.innerHTML += `<span class="info">   文件名: ${selectedFile.name}</span>\n`
        result.innerHTML += `<span class="info">   大小: ${(selectedFile.size / 1024).toFixed(2)} KB</span>\n`
        result.innerHTML += `<span class="info">   Base64长度: ${base64Data.length} 字符 (~${(base64Data.length*3/4/1024).toFixed(1)} KB)</span>\n`
        result.innerHTML += `<span class="info">通过 Cloudbase.callFunction 上传（无大小限制）...</span>\n`

        const res = await app.callFunction({
          name: 'admin-upload',
          data: {
            action: 'uploadImage',
            data: {
              base64Data: base64Data,
              fileName: selectedFile.name,
              folder: 'banner'
            }
          }
        })

        const data = res.result

        result.innerHTML += `<span class="info">[完整响应]:\n${JSON.stringify(data, null, 2)}</span>\n`

        if (data.code === 200 && data.data?.success) {
          status.className = 'status-badge status-success'
          status.textContent = '✅ 上传成功'
          
          result.innerHTML += `\n<span class="success">╔══════════════════════════════════════╗</span>\n`
          result.innerHTML += `<span class="success">║  🎉 图片上传成功！                    ║</span>\n`
          result.innerHTML += `<span class="success">╠══════════════════════════════════════╣</span>\n`
          result.innerHTML += `<span class="success">║  FileID:  ${data.data.fileID?.substring(0, 40)}...     ║</span>\n`
          result.innerHTML += `<span class="success">║  URL:     ${data.data.tempFileURL?.substring(0, 45)}...       ║</span>\n`
          result.innerHTML += `<span class="success">║  路径:    ${data.data.cloudPath}           ║</span>\n`
          result.innerHTML += `<span class="success">╚══════════════════════════════════════╝</span>\n`
          result.innerHTML += `<span class="success">\n💡 通过 Cloudbase.callFunction 上传，无 HTTP 触发器大小限制！</span>`

          if (data.data.tempFileURL) {
            result.innerHTML += `\n<span class="info">图片预览:</span>\n`
            result.innerHTML += `<img src="${data.data.tempFileURL}" style="max-width: 300px; margin-top: 8px; border-radius: 8px;" />`
          }

        } else {
          status.className = 'status-badge status-error'
          status.textContent = '❌ 上传失败'
          result.innerHTML += `\n<span class="error">❌ 错误信息: ${data.msg}</span>\n`
        }

      } catch (error) {
        status.className = 'status-badge status-error'
        status.textContent = '❌ 请求失败'
        result.innerHTML += `<span class="error">\n❌ 错误: ${error.message}\n</span>`
      }

      btn.disabled = false
      btn.textContent = '重新上传'
    }

    window.onload = () => {
      console.log('%c🚀 admin-upload 接口测试工具已加载 (Cloudbase SDK 模式)', 'font-size: 20px; color: #667eea; font-weight: bold;')
      console.log('%c点击按钮开始测试...', 'color: #666;')
    }
  </script>
</body>
</html>
