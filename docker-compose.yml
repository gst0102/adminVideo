version: "3.8"

services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-admin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - TZ=Asia/Shanghai
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    driver: bridge